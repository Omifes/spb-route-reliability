services:
  postgres:
    image: postgres:16-alpine
    container_name: spb-transit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spb_transit}
      POSTGRES_USER: ${POSTGRES_USER:-spb_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spb_app}
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spb_app} -d ${POSTGRES_DB:-spb_transit}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Необязательный веб-клиент. Запуск: docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: spb-transit-pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-spb_admin}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  pgadmin-data:
